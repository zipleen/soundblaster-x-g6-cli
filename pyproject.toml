#
# Build system
#
[build-system]
requires = ["setuptools>=82.0.0"]
build-backend = "setuptools.build_meta"

#
# Project
#
[project]
name = "soundblaster-x-g6-cli"
# This is the *distribution* version: it names the released .app/.dmg and the
# git tag the release workflow creates (v<version>). In this fork it tracks the
# GUI, not upstream's CLI -- keep it in step with g6_gui/__init__.py's VERSION.
# src/g6_cli/__init__.py is upstream's and is deliberately left alone.
version = "0.2.1"
#
dependencies = [
    "hidapi==0.15.0",
    "pyusb==1.3.1"
]
requires-python = ">=3.12"
#
authors = [
    { name = "Nils Skowasch", email = "nils_s89_dev@gmx.de" }
]
maintainers = [
    { name = "Nils Skowasch", email = "nils_s89_dev@gmx.de" }
]
#
description = "A CLI tool for controlling the SoundBlaster X G6"
readme = { file = "readme.md", content-type = "text/markdown" }
#
license = "GPL-2.0-only"
license-files = ["LICENSE"]
#
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
#
keywords = ["SoundBlaster X G6", "SoundBlaster X G6 CLI", "CLI"]
#
[project.urls]
Repository = "https://github.com/nils-skowasch/soundblaster-x-g6-cli"
#
[project.optional-dependencies]
gui = ["toga>=0.5.6"]

[project.scripts]
soundblaster-x-g6-cli = "g6_cli:main"
soundblaster-x-g6-gui = "g6_gui:main"

#
# Tool: package-dir
#
[tool.setuptools.package-dir]
"" = "src"

#
# Tool: find
#
[tool.setuptools.packages.find]
where = ["src"]

#
# Tool: tox
#
[tool.tox]
requires = ["tox>=4.21"]
env_list = ["py312"]

[tool.tox.env_run_base]
description = "run tests"
deps = ["pytest>=9", "pytest-asyncio>=1.0", "toga>=0.5.6"]
commands = [
    ["pytest", "{posargs:tests}"],
]

[tool.tox.env.py312]
description = "Run tests under Python 3.12 installed with pyenv"
base_python = ["{env:HOME}/.pyenv/versions/3.12.3/bin/python"]

#
# Tool: pytest
#
[tool.pytest.ini_options]
asyncio_mode = "auto"

#
# Tool: briefcase (macOS .app / .dmg packaging)
#
[tool.briefcase]
project_name = "Sound Blaster X G6"
bundle = "dev.g6cli"
# Keep in step with [project].version above.
version = "0.2.1"
author = "Nils Skowasch"
author_email = "nils_s89_dev@gmx.de"
url = "https://github.com/nils-skowasch/soundblaster-x-g6-cli"

[tool.briefcase.app.g6_gui]
formal_name = "Sound Blaster X G6"
description = "Control the Sound Blaster X G6 USB sound card"
long_description = """A desktop GUI for the Sound Blaster X G6, exposing the
controls of soundblaster-x-g6-cli as native widgets.
"""
icon = "packaging/resources/g6"
sources = ["src/g6_gui", "src/g6_cli", "src/g6_device"]
requires = [
    "hidapi==0.15.0",
    "pyusb==1.3.1",
]

[tool.briefcase.app.g6_gui.macOS]
universal_build = false
requires = [
    "toga-cocoa>=0.5.6",
    "std-nslog>=1.0.3",
]
